name: Windows11_22H2_amd64

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/win11-22H2-22621.yml'

permissions:
  contents: write

env:
  Build_VERSION: '22621.6060'
  FILE_NAME: Windows11_22H2_amd64
  FIX_RELEASE_TAG: Windows11_22H2_amd64
  ALI_YUN_DRIVE_UPLOAD_PATH: /Windows_10_11_ISO/Windows11_22H2_amd64

jobs:
  Build_UUP:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # UUP 打包 ISO
      - name: UUP dump build ISO
        shell: cmd
        run: |
          cd %FILE_NAME%
          dir
          uup_download_windows.cmd

      - name: List ISO Files
        shell: cmd
        run: |
          cd %FILE_NAME%
          dir *.iso
          cd ..

      # 安装 7zip
      - name: Install 7-Zip via Powershell
        shell: pwsh
        run: |
          choco install 7zip -y
          echo "${env:ProgramFiles}\7-Zip" | Out-File -FilePath $env:GITHUB_PATH -Append

      # 1.9G 分卷压缩
      - name: Split Compress ZIP(1.9G/part)
        shell: cmd
        run: 7z a -tzip -v1900M %FIX_RELEASE_TAG%_%Build_VERSION%.zip %FILE_NAME%\*.iso -mx=6

      # 上传制品
      - name: Upload Split Zip Artifact
        uses: actions/upload-artifact@v6
        with:
          name: ISO-Split-Zip-Pack
          path: |
            ${{ env.FIX_RELEASE_TAG }}_${{ env.Build_VERSION }}.zip.*

      # 创建 GitHub Release
      - name: Create Github Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.FIX_RELEASE_TAG }}_${{ env.Build_VERSION }}
          name: Release ${{ env.FIX_RELEASE_TAG }}_${{ env.Build_VERSION }}
          files: |
            ${{ env.FIX_RELEASE_TAG }}_${{ env.Build_VERSION }}.zip.*
          generate_release_notes: false
          append_body: false

      # ==================== 阿里云盘上传（已全修复）====================
      # 安装稳定版 aliyunpan v0.3.7
      - name: Install aliyunpan-cli v0.3.7
        shell: pwsh
        run: |
          $url = "https://ghfast.top/https://github.com/tickstep/aliyunpan/releases/download/v0.3.7/aliyunpan-v0.3.7-windows-x64.zip"
          Invoke-WebRequest -Uri $url -OutFile aliyunpan.zip -UseBasicParsing -TimeoutSec 180 -SkipCertificateCheck
          7z x aliyunpan.zip -oaliyunpan -spe -y
          $ALI_EXE = (Get-ChildItem ./aliyunpan -Recurse -Filter "aliyunpan.exe").FullName
          if(-not (Test-Path $ALI_EXE)){
            Write-Error "aliyunpan.exe 不存在，终止任务"
            exit 1
          }
          echo "ALI_EXE=$ALI_EXE" >> $env:GITHUB_ENV
          Write-Host "阿里云盘客户端路径：$ALI_EXE"

      # 登录阿里云盘
      - name: Login to Aliyun Drive
        shell: pwsh
        run: |
          & "$env:ALI_EXE" login -RefreshToken "${{ secrets.ALI_REFRESH_TOKEN }}"
          & "$env:ALI_EXE" whoami

      # 创建远端目录（不存在才创建）
      - name: Create remote directory
        shell: pwsh
        run: |
          $remotePath="${{ env.ALI_YUN_DRIVE_UPLOAD_PATH }}"
          $check = & "$env:ALI_EXE" ls $remotePath 2>&1
          if($LASTEXITCODE -ne 0){
            Write-Host "目录不存在，创建：$remotePath"
            & "$env:ALI_EXE" mkdir "$remotePath"
          }else{
            Write-Host "目录已存在，跳过创建"
          }
          & "$env:ALI_EXE" ls $remotePath

      # 上传分卷文件到阿里云盘（正确命令 + 完整日志）
      - name: Upload files to Aliyun Drive
        shell: pwsh
        run: |
          $remotePath="${{ env.ALI_YUN_DRIVE_UPLOAD_PATH }}"
          $files = Get-ChildItem "${{ env.FIX_RELEASE_TAG }}_${{ env.Build_VERSION }}.zip.*"
          foreach ($f in $files) {
            Write-Host "=================================================="
            Write-Host "正在上传：$($f.Name)"
            & "$env:ALI_EXE" upload "$($f.FullName)" "$remotePath"
            Write-Host "上传完成，退出码：$LASTEXITCODE"
            Start-Sleep -Seconds 3
          }
          Write-Host "=================================================="
          Write-Host "【全部上传结束，列出网盘文件核对】"
          & "$env:ALI_EXE" ls $remotePath
