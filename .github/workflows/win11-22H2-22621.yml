name: Windows11_22H2_amd64

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/win11-22H2-22621.yml'

permissions:
  contents: write

env:
  Build_VERSION: '22621.6060'
  FILE_NAME: Windows11_22H2_amd64
  FIX_RELEASE_TAG: Windows11_22H2_amd64
  ALI_YUN_DRIVE_UPLOAD_PATH: /Windows_10_11_ISO/Windows11_22H2_amd64/

jobs:
  Build_UUP:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # UUP打包ISO
      - name: UUP dump build ISO
        shell: cmd
        run: |
          cd %FILE_NAME%
          dir
          uup_download_windows.cmd

      - name: List ISO Files
        shell: cmd
        run: |
          cd %FILE_NAME%
          dir *.iso
          cd ..

      # 安装7zip
      - name: Install 7-Zip via Powershell
        shell: pwsh
        run: |
          choco install 7zip -y
          echo "${env:ProgramFiles}\7-Zip" | Out-File -FilePath $env:GITHUB_PATH -Append

      # 1.9G分卷ZIP
      - name: Split Compress ZIP(1.9G/part)
        shell: cmd
        run: 7z a -tzip -v1900M %FIX_RELEASE_TAG%_%Build_VERSION%.zip %FILE_NAME%\*.iso -mx=6

      # 上传制品
      - name: Upload Split Zip Artifact
        uses: upload-artifact@v6
        with:
          name: ISO-Split-Zip-Pack
          path: |
            ${{ env.FIX_RELEASE_TAG }}_${{ env.Build_VERSION }}.zip.*

      # ===================== 关闭源码包 + 发布Release =====================
      - name: Create Github Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.FIX_RELEASE_TAG }}_${{ env.Build_VERSION }}
          name: Release ${{ env.FIX_RELEASE_TAG }}_${{ env.Build_VERSION }}
          files: |
            ${{ env.FIX_RELEASE_TAG }}_${{ env.Build_VERSION }}.zip.*
          generate_release_notes: false
          draft: false
          prerelease: false
          # ✅ 关键：禁止自动上传源码包
          body: "no source code"
          append_body: false

      # ===================== 修复 aliyunpan 解压嵌套目录 =====================
      - name: Install aliyunpan-cli
        shell: pwsh
        run: |
          $url = "https://mirror.ghproxy.com/https://github.com/tickstep/aliyunpan/releases/download/v0.3.9/aliyunpan-v0.3.9-windows-x64.zip"
          Invoke-WebRequest -Uri $url -OutFile aliyunpan.zip
          7z x aliyunpan.zip -oaliyunpan -y -spe    # 加了 -spe 剥离嵌套文件夹
          dir ./aliyunpan

      # ===================== 修复登录 =====================
      - name: Login to Aliyun Drive
        shell: pwsh
        run: |
          ./aliyunpan/aliyunpan.exe login -RefreshToken "${{ secrets.ALI_REFRESH_TOKEN }}"

      # ===================== 修复批量上传 =====================
      - name: Upload files to Aliyun Drive
        shell: pwsh
        run: |
          $files = Get-ChildItem "${{ env.FIX_RELEASE_TAG }}_${{ env.Build_VERSION }}.zip.*"
          foreach ($f in $files) {
            ./aliyunpan/aliyunpan.exe u $f.FullName "${{ env.ALI_YUN_DRIVE_UPLOAD_PATH }}"
          }
