name: Auto Unzip Zip To Same Name Folder
on:
  push:
    branches: [ main ]
    paths:
      - '*.zip'
      - ".github/workflows/Auto Unzip Root Zip.yml"
jobs:
  unzip_job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: false # 关闭拉取tag，避免main分支/tag同名冲突

      - name: Unzip each zip into its own folder
        run: |
          for zipfile in ./*.zip; do
            [ -f "$zipfile" ] || continue
            # 截取压缩包名称，去掉后缀.zip
            foldername=$(basename "$zipfile" .zip)
            echo "===== 创建文件夹 $foldername 并解压 $zipfile ====="
            mkdir -p "$foldername"
            # 解压到对应文件夹
            unzip -o "$zipfile" -d "$foldername"
            # 删除原上传的zip包
            rm -f "$zipfile"
            echo "===== $zipfile 解压完成，存放目录 ./$foldername ====="
          done

      - name: Git Config
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global push.default current

      - name: Commit & Push Unzipped Files
        run: |
          git add .
          if git diff --cached --quiet; then
            echo "无解压文件变更，跳过提交"
          else
            git commit -m "Auto unzip zip to same-name folder from push"
            # 完整指定推送分支，彻底解决 refspec 歧义报错
            git push origin HEAD:refs/heads/main --force-with-lease
          fi
