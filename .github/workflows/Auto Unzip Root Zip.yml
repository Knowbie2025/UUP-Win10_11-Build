name: Auto Unzip Zip To Same Name Folder (Overwrite Exist)
on:
  push:
    branches: [ main ]
    paths:
      - '*.zip'
      - ".github/workflows/Auto Unzip Root Zip.yml"
jobs:
  unzip_job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: false

      - name: Unzip into same name folder, overwrite all files
        run: |
          for zipfile in ./*.zip; do
            [ -f "$zipfile" ] || continue
            foldername=$(basename "$zipfile" .zip)
            echo "===== 处理压缩包 $zipfile，目标目录 ./$foldername ====="
            # 可选：先清空原有文件夹，实现完整干净覆盖（整个目录清空重建）
            if [ -d "$foldername" ]; then
              echo "目录已存在，清空旧文件"
              rm -rf "$foldername"
            fi
            mkdir -p "$foldername"
            # -o 强制覆盖内部同名文件
            unzip -o "$zipfile" -d "$foldername"
            rm -f "$zipfile"
            echo "===== $zipfile 解压完成，已全部覆盖旧内容 ====="
          done

      - name: Git Config
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global push.default current

      - name: Commit & Push Changes
        run: |
          git add .
          if git diff --cached --quiet; then
            echo "无文件变更，跳过提交"
          else
            git commit -m "Auto unzip & overwrite folder from zip push"
            git push origin HEAD:refs/heads/main --force-with-lease
          fi
