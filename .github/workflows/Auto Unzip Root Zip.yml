name: Auto Unzip Full Overwrite All Files
on:
  push:
    branches: [ main ]
    paths:
      - '*.zip'
jobs:
  unzip_job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full repo
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: false

      - name: Process zip & full overwrite
        run: |
          for zipfile in ./*.zip; do
            [ -f "$zipfile" ] || continue
            foldername=$(basename "$zipfile" .zip)
            echo "===== 处理 $zipfile 目标目录 ./$foldername ====="

            # ========== 核心改动：告诉Git删除整个目录，再重建 ==========
            if [ -d "$foldername" ]; then
              # 先git rm 从版本库标记删除，不是仅本地删
              git rm -rf "$foldername"
              echo "Git标记删除旧目录 $foldername"
            fi

            # 新建目录并解压
            mkdir -p "$foldername"
            unzip -o "$zipfile" -d "$foldername"

            # 强制修改所有文件时间，强制产生内容变更
            find "$foldername" -type f -exec touch {} \;

            # 删除根目录zip包
            rm -f "$zipfile"
            echo "===== $zipfile 解压完成 ====="
          done

      - name: Git config
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit & Push
        run: |
          git add --all
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
          else
            git commit -m "Full overwrite: delete old dir & re-unzip all files"
            git push origin HEAD:refs/heads/main --force-with-lease
          fi
