name: Auto Unzip Full Overwrite With Timestamp
on:
  push:
    branches: [ main ]
    paths:
      - '*.zip'
jobs:
  unzip_job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full repo
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: false

      - name: Process zip & full overwrite
        run: |
          for zipfile in ./*.zip; do
            [ -f "$zipfile" ] || continue
            foldername=$(basename "$zipfile" .zip)
            echo "===== 处理 $zipfile 目标目录 ./$foldername ====="

            # 从Git版本库标记删除整个旧目录
            if [ -d "$foldername" ]; then
              git rm -rf "$foldername"
              echo "Git 删除旧目录 $foldername"
            fi

            mkdir -p "$foldername"
            unzip -o "$zipfile" -d "$foldername"

            # 关键：生成唯一时间戳文件，强制产生文件变更
            date +"%Y-%m-%d %H:%M:%S" > "$foldername/_auto_update_timestamp.txt"
            
            rm -f "$zipfile"
            echo "===== $zipfile 解压完成 ====="
          done

      - name: Git config
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit & Push
        run: |
          git add --all
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
          else
            git commit -m "Full overwrite: delete old dir + add timestamp mark"
            git push origin HEAD:refs/heads/main --force-with-lease
          fi
