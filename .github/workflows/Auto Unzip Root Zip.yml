name: Auto Unzip Root Zip File
on:
  push:
    branches: [ main ]
    paths:
      - '*.zip'
      - ".github/workflows/Auto Unzip Root Zip.yml"
jobs:
  unzip_job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: false # 不下载任何tag，从源头规避同名冲突

      - name: Unzip all zip to repo root
        run: |
          for zipfile in ./*.zip; do
            [ -f "$zipfile" ] || continue
            echo "===== 正在解压 $zipfile ====="
            unzip -o "$zipfile"
            rm -f "$zipfile"
            echo "===== $zipfile 解压完成并删除 ====="
          done

      - name: Git Config
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global push.default current

      - name: Commit & Push Unzipped Files
        run: |
          git add .
          if git diff --cached --quiet; then
            echo "无解压文件变更，跳过提交"
          else
            git commit -m "Auto unzip root zip file from push"
            # 强制指定推送本地HEAD到远程main分支，绕过tag歧义
            git push origin HEAD:refs/heads/main --force-with-lease
          fi
