name: Windows11_26H2_amd64

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/win11-26H2-28020.yml'

permissions:
  contents: write

env:
  Build_VERSION: '28020.2207'
  FILE_NAME: Windows11_26H2_amd64
  FIX_RELEASE_TAG: Windows11_26H2_amd64
  ALI_YUN_DRIVE_UPLOAD_PATH: /Windows_10_11_ISO/Windows11_26H2_amd64

jobs:
  Build_UUP:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # UUP 打包 ISO
      - name: UUP dump build ISO
        shell: cmd
        run: |
          cd %FILE_NAME%
          dir
          uup_download_windows.cmd

      - name: List ISO Files
        shell: cmd
        run: |
          cd %FILE_NAME%
          dir *.iso
          cd ..

      # 安装 7zip
      - name: Install 7-Zip via Powershell
        shell: pwsh
        run: |
          choco install 7zip -y
          echo "${env:ProgramFiles}\7-Zip" | Out-File -FilePath $env:GITHUB_PATH -Append

      # 分卷压缩 1900M每卷
      - name: Split Compress ZIP(1.9G/part)
        shell: cmd
        run: 7z a -tzip -v1900M %FIX_RELEASE_TAG%_%Build_VERSION%.zip %FILE_NAME%\*.iso -mx=6

      # 上传制品
      - name: Upload Split Zip Artifact
        uses: actions/upload-artifact@v6
        with:
          name: ISO-Split-Zip-Pack
          path: |
            ${{ env.FIX_RELEASE_TAG }}_${{ env.Build_VERSION }}.zip.*

      # 发布 Release
      - name: Create Github Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.FIX_RELEASE_TAG }}_${{ env.Build_VERSION }}
          name: Release ${{ env.FIX_RELEASE_TAG }}_${{ env.Build_VERSION }}
          files: |
            ${{ env.FIX_RELEASE_TAG }}_${{ env.Build_VERSION }}.zip.*
          generate_release_notes: false
          append_body: false

      # ==========关键1：固定v0.3.7稳定版，抛弃最新BUG版==========
      - name: Install aliyunpan-cli(v0.3.7稳定无崩溃版)
        shell: pwsh
        run: |
          $url = "https://ghfast.top/https://github.com/tickstep/aliyunpan/releases/download/v0.3.7/aliyunpan-v0.3.7-windows-x64.zip"
          Write-Host "Download fixed v0.3.7 aliyunpan: $url"
          Invoke-WebRequest -Uri $url -OutFile aliyunpan.zip -UseBasicParsing -TimeoutSec 180 -SkipCertificateCheck
          7z x aliyunpan.zip -oaliyunpan -spe -y
          Get-ChildItem ./aliyunpan -Recurse
          $ALI_EXE = (Get-ChildItem ./aliyunpan -Recurse -Filter "aliyunpan.exe").FullName
          if(-not $ALI_EXE){
            Write-Error "aliyunpan.exe 未找到！"
            exit 1
          }
          echo "ALI_EXE=$ALI_EXE" >> $env:GITHUB_ENV
          Write-Host "Aliyunpan路径: $ALI_EXE"

      # 登录阿里云盘（v0.3.7支持--RefreshToken参数）
      - name: Login to Aliyun Drive
        shell: pwsh
        run: |
          & "$env:ALI_EXE" login -RefreshToken "${{ secrets.ALI_REFRESH_TOKEN }}"
          & "$env:ALI_EXE" whoami

      # 判断创建远端目录
      - name: Mkdir Aliyun Remote Dir
        shell: pwsh
        run: |
          $remotePath="${{ env.ALI_YUN_DRIVE_UPLOAD_PATH }}"
          $checkRet = & "$env:ALI_EXE" ls "$remotePath" 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Host "目录不存在，创建远端目录：$remotePath"
            & "$env:ALI_EXE" mkdir "$remotePath"
          } else {
            Write-Host "远端目录已存在，跳过创建"
            Write-Host "目录内容:"
            & "$env:ALI_EXE" ls "$remotePath"
          }

      # ==========关键2：u命令→upload命令，修复nil指针崩溃BUG==========
      - name: Upload files to Aliyun Drive
        shell: pwsh
        run: |
          $fileList = Get-ChildItem "${{ env.FIX_RELEASE_TAG }}_${{ env.Build_VERSION }}.zip.*"
          foreach($f in $fileList){
            Write-Host "正在上传：$($f.Name)"
            # v0.3.7标准正确上传指令：upload 本地文件 远端目录
            & "$env:ALI_EXE" upload "$($f.FullName)" "${{ env.ALI_YUN_DRIVE_UPLOAD_PATH }}"
            Write-Host "$($f.Name) 上传完毕，退出码:$LASTEXITCODE"
            Start-Sleep -Seconds 4
          }
          Write-Host "全部上传完成，列出网盘目录校验："
          & "$env:ALI_EXE" ls "${{ env.ALI_YUN_DRIVE_UPLOAD_PATH }}"
