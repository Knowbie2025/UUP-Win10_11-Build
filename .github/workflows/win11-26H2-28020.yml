name: Windows11_26H2_amd64

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '**.yml'

permissions:
  contents: write

env:
  Build_VERSION: '28020.2207'
  FILE_NAME: Windows11_26H2_amd64
  FIX_RELEASE_TAG: Windows11_26H2_amd64
  ALI_TARGET_DIR: "/Windows_10_11_ISO/Windows11_26H2_amd64/"

jobs:
  Build_UUP:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: UUP dump build ISO
        shell: cmd
        run: |
          cd %FILE_NAME%
          dir
          uup_download_windows.cmd

      - name: List ISO Files
        shell: cmd
        run: |
          cd %FILE_NAME%
          dir *.iso
          cd ..

      - name: Install 7-Zip via Powershell
        shell: pwsh
        run: |
          choco install 7zip -y
          echo "${env:ProgramFiles}\7-Zip" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Split Compress ZIP(1.9G/part)
        shell: cmd
        run: 7z a -tzip -v1900M %FIX_RELEASE_TAG%_%Build_VERSION%.zip %FILE_NAME%\*.iso -mx=6

      - name: Upload Split Zip Artifact
        uses: actions/upload-artifact@v5
        with:
          name: ISO-Split-Zip-Pack
          path: |
            ${{ env.FIX_RELEASE_TAG }}_${{ env.Build_VERSION }}.zip.*

      - name: Create Github Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.FIX_RELEASE_TAG }}_${{ env.Build_VERSION }}
          name: Release ${{ env.FIX_RELEASE_TAG }}_${{ env.Build_VERSION }}
          files: |
            ${{ env.FIX_RELEASE_TAG }}_${{ env.Build_VERSION }}.zip.*

      - name: Install Rclone
        shell: pwsh
        run: |
          choco install rclone -y

      - name: Rclone配置阿里云盘WebDAV
        shell: pwsh
        run: |
          mkdir -Force $env:USERPROFILE\.config\rclone
          @"
[aliyun]
type = webdav
url = http://localhost:8080/dav
vendor = other
user = ${{ secrets.ALI_WEBDAV_USER }}
pass = ${{ secrets.ALI_WEBDAV_PWD }}
"@ | Out-File $env:USERPROFILE\.config\rclone\rclone.conf -Encoding utf8

      - name: 启动阿里云盘WebDAV服务
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install aliyundrive-webdav
          Start-Job -ScriptBlock {aliyundrive-webdav --refresh-token ${{ secrets.ALI_REFRESH_TOKEN }} --host 127.0.0.1 --port 8080 -U ${{ secrets.ALI_WEBDAV_USER }} -W ${{ secrets.ALI_WEBDAV_PWD }} --no-trash}
          Start-Sleep -Seconds 8

      - name: 自动创建云盘目录+上传分卷压缩包
        shell: pwsh
        run: |
          rclone mkdir aliyun:${{ env.ALI_TARGET_DIR }} --ignore-existing
          rclone copy . aliyun:${{ env.ALI_TARGET_DIR }} --include "${{ env.FIX_RELEASE_TAG }}_${{ env.Build_VERSION }}.zip.*" --progress
