name: Windows11_26H2_amd64

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      # 仅匹配文件名含26H2的yml，修改其它yml不会触发本任务。
      - '.github/workflows/win11-26H2-28020.yml'

permissions:
  contents: write

env:
  Build_VERSION: '28020.2207'
  FILE_NAME: Windows11_26H2_amd64
  FIX_RELEASE_TAG: Windows11_26H2_amd64
  # 阿里云盘上传目标目录
  ALI_YUN_DRIVE_UPLOAD_PATH: /Windows_10_11_ISO/Windows11_26H2_amd64/

jobs:
  Build_UUP:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # =====新增：自动获取aliyunpan最新版本tag=====
      - name: Get latest aliyunpan release tag
        id: get_ali_ver
        shell: pwsh
        run: |
          # 请求api拿最新release tag
          $res = Invoke-RestMethod -Uri "https://api.github.com/repos/tickstep/aliyunpan/releases/latest"
          $latest_tag = $res.tag_name
          echo "latest_ver=$latest_tag" >> $env:GITHUB_ENV

      # UUP打包ISO
      - name: UUP dump build ISO
        shell: cmd
        run: |
          cd %FILE_NAME%
          dir
          uup_download_windows.cmd

      - name: List ISO Files
        shell: cmd
        run: |
          cd %FILE_NAME%
          dir *.iso
          cd ..

      # 安装7zip
      - name: Install 7-Zip via Powershell
        shell: pwsh
        run: |
          choco install 7zip -y
          echo "${env:ProgramFiles}\7-Zip" | Out-File -FilePath $env:GITHUB_PATH -Append

      # 1.9G分卷ZIP
      - name: Split Compress ZIP(1.9G/part)
        shell: cmd
        run: 7z a -tzip -v1900M %FIX_RELEASE_TAG%_%Build_VERSION%.zip %FILE_NAME%\*.iso -mx=6

      # 上传制品【v5→v6】
      - name: Upload Split Zip Artifact
        uses: actions/upload-artifact@v6
        with:
          name: ISO-Split-Zip-Pack
          path: |
            ${{ env.FIX_RELEASE_TAG }}_${{ env.Build_VERSION }}.zip.*

      # Github发布Release（关闭自动源码包，实现Assets默认展开）
      - name: Create Github Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.FIX_RELEASE_TAG }}_${{ env.Build_VERSION }}
          name: Release ${{ env.FIX_RELEASE_TAG }}_${{ env.Build_VERSION }}
          files: |
            ${{ env.FIX_RELEASE_TAG }}_${{ env.Build_VERSION }}.zip.*
          generate_release_notes: false # 关闭自动生成Source code压缩包

      # =================自动拼接最新版本下载链接=================
      - name: Install aliyunpan-cli(自动最新版)
        shell: pwsh
        run: |
          $ver = "${{ env.latest_ver }}"
          $url = "https://github.com/tickstep/aliyunpan/releases/download/$ver/aliyunpan-$ver-windows-x64.zip"
          Write-Host "Download aliyunpan: $url"
          Invoke-WebRequest -Uri $url -OutFile aliyunpan.zip
          7z x aliyunpan.zip -oaliyunpan
          echo "$pwd\aliyunpan" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Login to Aliyun Drive
        shell: pwsh
        run: |
          aliyunpan login -RefreshToken "${{ secrets.ALI_REFRESH_TOKEN }}"

      - name: Upload files to Aliyun Drive
        shell: pwsh
        run: |
          aliyunpan u "${{ env.FIX_RELEASE_TAG }}_${{ env.Build_VERSION }}.zip.*" "${{ env.ALI_YUN_DRIVE_UPLOAD_PATH }}"
