name: Windows11_26H1_amd64

on: workflow_dispatch

permissions:
  contents: write

env:
  Build_VERSION: '28000.2113'
  FILE_NAME: Windows11_26H1_amd64
  FIX_RELEASE_TAG: Windows11_26H1_amd64

jobs:
  Build_UUP:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # UUP生成ISO
      - name: UUP dump build ISO
        shell: cmd
        run: |
          cd %FILE_NAME%
          dir
          uup_download_windows.cmd

       # CMD查看ISO目录
      - name: List ISO Files
        shell: cmd
        run: |
          cd %FILE_NAME%
          dir *.iso
          cd ..

      # PS安装7zip不变
      - name: Install 7-Zip via Powershell
        shell: pwsh
        run: |
          choco install 7zip -y
          echo "${env:ProgramFiles}\7-Zip" | Out-File -FilePath $env:GITHUB_PATH -Append

      # 关键修改：分卷包名自动带上 Build_VERSION 版本号
      - name: Split Compress ZIP(1.9G/part)
        shell: cmd
        run: 7z a -tzip -v1900M %FIX_RELEASE_TAG%_%Build_VERSION%.zip %FILE_NAME%\*.iso -mx=6

      - name: Upload Split Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ISO-Split-Zip-Pack
          path: |
            *%Build_VERSION%.zip
            *%Build_VERSION%.z01
            *%Build_VERSION%.z02
            *%Build_VERSION%.z*

      - name: Create Github Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.FIX_RELEASE_TAG }}
          name: Release ${{ env.FIX_RELEASE_TAG }}
          files: |
            *%Build_VERSION%.zip
            *%Build_VERSION%.z01
            *%Build_VERSION%.z02
            *%Build_VERSION%.z*
