name: 清理失败Action记录20260716
on:
  workflow_dispatch: # 手动触发
  schedule:
    - cron: "0 2 * * *"

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: 清理所有失败的运行记录
        shell: pwsh
        run: |
          $headers = @{
            Authorization = "Bearer ${{ secrets.GITHUB_TOKEN }}"
            Accept = "application/vnd.github.v3+json"
          }
          $owner = "Knowbie2025"
          $repo = "UUP-Win10_11-Build"
          # 获取全部运行记录
          $runs = Invoke-RestMethod -Uri "https://api.github.com/repos/$owner/$repo/actions/runs?per_page=100" -Headers $headers
          foreach ($run in $runs.workflow_runs) {
            # 仅删除状态为failure失败的记录
            if ($run.conclusion -eq "failure") {
              Invoke-RestMethod -Uri $run.url -Method Delete -Headers $headers
              Write-Host "已删除失败运行：$($run.id)"
            }
          }
