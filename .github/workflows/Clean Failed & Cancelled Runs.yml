name: Clean Failed & Cancelled Runs

# 触发方式：1.手动运行 2.可选定时自动清理（注释可关闭定时）
on:
  workflow_dispatch: # 支持仓库Actions页面手动点击运行（你现在用的方式）
  schedule:
    - cron: '0 2 * * 0' # 每周日凌晨2点自动清理，不需要就整段注释掉

# 关键：授予Actions删除流水线必需权限（之前大概率缺这个导致删不掉）
permissions:
  actions: write
  contents: read

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Install GitHub CLI
        run: sudo apt update && sudo apt install gh -y

      - name: Auth with GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh auth login --with-token <<< "$GH_TOKEN"

      - name: Count & Delete failed/cancelled runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 统计待删除数量并打印日志
          total=$(gh run list --status failed,cancelled --limit 300 --json id | jq '. | length')
          echo "待清理失败/取消流水线总数：$total"

          # 分批删除，每条间隔1秒防GitHub API限流
          gh run list --status failed,cancelled --limit 300 --json id \
            | jq -r '.[].id' \
            | while read -r runid; do
                gh run delete "$runid"
                echo "已删除RunID: $runid"
                sleep 1
              done
