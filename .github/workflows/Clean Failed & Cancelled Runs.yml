name: Clean Failed & Cancelled Runs
on:
  workflow_dispatch:
  schedule:
    # UTC19点 = 北京时间3点，每日自动执行
    - cron: '0 19 * * *'

permissions:
  actions: write
  contents: read

jobs:
  clean:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Install GitHub CLI
        run: |
          sudo apt update && sudo apt install gh -y

      - name: Delete failed/cancelled/timed_out runs
        run: |
          gh run list --status failure,cancelled,timed_out --all --limit 500 --json databaseId \
            | jq -r '.[].databaseId' | xargs -I{} gh run delete {}
          echo "✅ 异常流水线清理完毕"
