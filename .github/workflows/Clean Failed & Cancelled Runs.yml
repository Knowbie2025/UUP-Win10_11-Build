      - name: Clean all invalid runs
        run: |
          page=1
          total=0
          status_arr=("cancelled" "failure" "timed_out")
          while true;do
              all_ids=""
              for s in "${status_arr[@]}";do
                  ids=$(gh run list --status "$s" --limit 100 --page $page --json databaseId | jq -r '.[].databaseId')
                  all_ids+="$ids"$'\n'
              done
              clean_ids=$(echo "$all_ids" | sort -u | sed '/^$/d')
              if [ -z "$clean_ids" ];then
                  echo "✅ 遍历完毕，本次共删除$total条记录"
                  break
              fi
              echo "$clean_ids" | xargs -I{} gh run delete {}
              cnt=$(echo "$clean_ids" | wc -l)
              total=$((total+cnt))
              echo "✅ 第$page页，清理$cnt条，累计:$total"
              page=$((page+1))
          done
