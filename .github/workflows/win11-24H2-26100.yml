name: Windows11_24H2_amd64

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      # 仅匹配文件名含24H2的yml，修改其它yml不会触发本任务。
      - '.github/workflows/*24H2*.yml'

permissions:
  contents: write

env:
  Build_VERSION: '26100.8524'
  FILE_NAME: Windows11_24H2_amd64
  FIX_RELEASE_TAG: Windows11_24H2_amd64
  # 阿里云盘上传目标目录
  ALI_YUN_DRIVE_UPLOAD_PATH: /Windows_10_11_ISO/Windows11_24H2_amd64/

jobs:
  Build_UUP:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # UUP打包ISO
      - name: UUP dump build ISO
        shell: cmd
        run: |
          cd %FILE_NAME%
          dir
          uup_download_windows.cmd

      - name: List ISO Files
        shell: cmd
        run: |
          cd %FILE_NAME%
          dir *.iso
          cd ..

      # 安装7zip
      - name: Install 7-Zip via Powershell
        shell: pwsh
        run: |
          choco install 7zip -y
          echo "${env:ProgramFiles}\7-Zip" | Out-File -FilePath $env:GITHUB_PATH -Append

      # 1.9G分卷ZIP
      - name: Split Compress ZIP(1.9G/part)
        shell: cmd
        run: 7z a -tzip -v1900M %FIX_RELEASE_TAG%_%Build_VERSION%.zip %FILE_NAME%\*.iso -mx=6

      # 上传制品【v5→v6】
      - name: Upload Split Zip Artifact
        uses: actions/upload-artifact@v6
        with:
          name: ISO-Split-Zip-Pack
          path: |
            ${{ env.FIX_RELEASE_TAG }}_${{ env.Build_VERSION }}.zip.*

      # Github发布Release（已经是v2，原生Node24不用改）
      - name: Create Github Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.FIX_RELEASE_TAG }}_${{ env.Build_VERSION }}
          name: Release ${{ env.FIX_RELEASE_TAG }}_${{ env.Build_VERSION }}
          files: |
            ${{ env.FIX_RELEASE_TAG }}_${{ env.Build_VERSION }}.zip.*

      # ===================== 替换为 chyroc/aliyundrive-cli v0.14.5 =====================
      - name: Install aliyundrive-cli
        shell: pwsh
        run: |
          $ver="v0.14.5"
          $url="https://github.com/chyroc/aliyundrive-cli/releases/download/$ver/aliyundrive-cli_Windows_x86_64.zip"
          Invoke-WebRequest -Uri $url -OutFile aliyundrive.zip
          7z x aliyundrive.zip -oaliyundrive
          echo "$pwd\aliyundrive" | Out-File -FilePath $env:GITHUB_PATH -Append

      # 登录：该cli用RefreshToken环境变量，Secrets依旧填ALI_REFRESH_TOKEN
      - name: Login AliyunDrive
        shell: pwsh
        env:
          ALIYUNDRIVE_REFRESH_TOKEN: ${{ secrets.ALI_REFRESH_TOKEN }}
        run: |
          # 自动读取环境变量鉴权，无需手动login命令
          aliyundrive whoami

      # 批量上传分卷压缩包
      - name: Upload to AliyunDrive
        shell: pwsh
        run: |
          aliyundrive upload --dst ${{ env.ALI_YUN_DRIVE_UPLOAD_PATH }} ${{ env.FIX_RELEASE_TAG }}_${{ env.Build_VERSION }}.zip.*
