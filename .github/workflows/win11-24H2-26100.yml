name: AutoUnzip & UUP Build Windows11_24H2_amd64
permissions:
  contents: write
env:
  Build_VERSION: '26100.8737a'
  FILE_NAME: Windows11_24H2_amd64
  FIX_RELEASE_TAG: Windows11_24H2_amd64
  ALI_YUN_DRIVE_UPLOAD_PATH: Windows_10_11_ISO/Windows11_24H2_amd64
  ALIST_URL: ${{ secrets.ALIST_DOMAIN }}
  ALIST_USER: ${{ secrets.ALIST_USER }}
  ALIST_PASS: ${{ secrets.ALIST_PWD }}

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      # 编辑本工作流文件触发打包任务
      - '.github/workflows/win11-24H2-26100.yml'

jobs:
  # 任务1：先执行自动解压全覆盖逻辑（上传zip自动运行）
  Auto_Unzip_Full_Overwrite:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && contains(github.event.head_commit.modified, '.zip')
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: false

      - name: Process zip package
        run: |
          for zipfile in ./*.zip; do
            [ -f "$zipfile" ] || continue
            foldername=$(basename "$zipfile" .zip)
            echo "===== 处理压缩包 $zipfile 目标文件夹 ./$foldername ====="

            # 1. 强制从Git版本库删除整个目录（所有历史文件标记删除）
            if [ -d "$foldername" ]; then
              git rm -rf --cached "$foldername"
              rm -rf "$foldername"
              echo "已标记Git删除旧目录 $foldername"
            fi

            # 2. 重建目录并解压
            mkdir -p "$foldername"
            unzip -o "$zipfile" -d "$foldername"

            # 3. 写入唯一时间戳文件，强制每次产生文件变更
            echo "Update time: $(date '+%Y-%m-%d %H:%M:%S')" > "$foldername/update_time.txt"

            # 4. 删除上传的zip包
            rm -f "$zipfile"
            echo "===== $zipfile 解压完成 ====="
          done

      - name: Git identity config
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Stage all changes (delete + new files)
        run: |
          git add --all
          if git diff --cached --quiet; then
            echo "无文件变更，跳过提交推送"
          else
            git commit -m "Force full overwrite: remove old dir & refresh all files timestamp"
            git push origin HEAD:refs/heads/main --force-with-lease
          fi

  # 任务2：依赖解压任务完成后，执行UUP打包上传（手动触发/编辑yml触发）
  Build_UUP_Task:
    needs: Auto_Unzip_Full_Overwrite
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.paths[0] == '.github/workflows/win11-24H2-26100.yml'
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # UUP 编译打包 ISO
      - name: UUP dump build ISO
        shell: cmd
        run: |
          cd %FILE_NAME%
          dir
          uup_download_windows.cmd

      - name: List ISO Files
        shell: cmd
        run: |
          cd %FILE_NAME%
          dir *.iso
          cd ..

      # 安装 7zip
      - name: Install 7-Zip via Powershell
        shell: pwsh
        run: |
          choco install 7zip -y
          echo "${env:ProgramFiles}\\7-Zip" | Out-File -FilePath $env:GITHUB_PATH -Append

      # 2000M 分卷压缩
      - name: Split Compress ZIP(1.95G/part)
        shell: cmd
        run: 7z a -tzip -v2000M %FIX_RELEASE_TAG%_%Build_VERSION%.zip %FILE_NAME%\*.iso -mx=6

      # 生成 Release 正文
      - name: Gen Release Body (Auto Open)
        id: gen_body
        shell: pwsh
        run: |
          $files = Get-ChildItem "${{ env.FIX_RELEASE_TAG }}_${{ env.Build_VERSION }}.zip.*" | Select-Object -ExpandProperty Name
          $md = "<details open>`n<summary>📦 各分卷压缩包名（包含：家庭中文版、专业版、企业版、教育版等等-下载各分卷至同一文件夹后解压任一即可）</summary>`n`n"
          foreach($f in $files){ $md += "- $f`n" }
          $md += "`n</details>"
          echo "BODY_CONTENT<<EOF" >> $env:GITHUB_ENV
          echo $md >> $env:GITHUB_ENV
          echo "EOF" >> $env:GITHUB_ENV

      # 上传制品缓存
      - name: Upload Split Zip Artifact
        uses: actions/upload-artifact@v6
        with:
          name: ISO-Split-Zip-Pack
          path: |
            ${{ env.FIX_RELEASE_TAG }}_${{ env.Build_VERSION }}.zip.*

      # 创建 Github Release
      - name: Create Github Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.FIX_RELEASE_TAG }}_${{ env.Build_VERSION }}
          name: Release ${{ env.FIX_RELEASE_TAG }}_${{ env.Build_VERSION }}
          body: ${{ env.BODY_CONTENT }}
          files: |
            ${{ env.FIX_RELEASE_TAG }}_${{ env.Build_VERSION }}.zip.*
          generate_release_notes: false
          append_body: false

      # 安装 aliyunpan-cli v0.3.7
      - name: Install aliyunpan-cli(v0.3.7)
        shell: pwsh
        run: |
          $url = "https://ghfast.top/https://github.com/tickstep/aliyunpan/releases/download/v0.3.7/aliyunpan-v0.3.7-windows-x64.zip"
          Invoke-WebRequest -Uri $url -OutFile aliyunpan.zip -UseBasicParsing -TimeoutSec 180 -SkipCertificateCheck
          7z x aliyunpan.zip -oaliyunpan -spe -y
          $ALI_EXE = (Get-ChildItem ./aliyunpan -Recurse -Filter "aliyunpan.exe").FullName
          echo "ALI_EXE=$ALI_EXE" >> $env:GITHUB_ENV

      # 阿里云盘 - Refresh Token 登录（精简稳定版，不再手动写配置文件）
      - name: Login to Aliyun Drive
        shell: pwsh
        run: |
          & "$env:ALI_EXE" token set -t "${{ secrets.ALI_REFRESH_TOKEN }}"
          & "$env:ALI_EXE" whoami

      # 阿里云盘自动建目录
      - name: Mkdir Aliyun Remote Dir
        shell: pwsh
        run: |
          $remotePath="${{ env.ALI_YUN_DRIVE_UPLOAD_PATH }}"
          Write-Host "阿里云目标路径：$remotePath"
          $checkRet = & "$env:ALI_EXE" ls "$remotePath" 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Host "目录不存在，正在创建..."
            & "$env:ALI_EXE" mkdir -p "$remotePath"
            Start-Sleep 2
          }

      # 阿里云盘分卷上传（带重试）
      - name: Upload to Aliyun Drive
        shell: pwsh
        run: |
          $remotePath="${{ env.ALI_YUN_DRIVE_UPLOAD_PATH }}"
          $fileList = Get-ChildItem "${{ env.FIX_RELEASE_TAG }}_${{ env.Build_VERSION }}.zip.*"
          & "$env:ALI_EXE" cd "$remotePath"
          foreach($f in $fileList){
            Write-Host "开始上传阿里云：$($f.Name)"
            $retry = 2
            for($i=0;$i -le $retry;$i++){
              & "$env:ALI_EXE" upload "$($f.FullName)"
              if($LASTEXITCODE -eq 0){ break }
              Write-Host "上传失败，等待10s重试，剩余重试次数：$($retry - $i)"
              Start-Sleep 10
            }
            Start-Sleep 3
          }

      # Alist 上传
      - name: Upload to Alist
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $baseUrl = "${{ env.ALIST_URL }}"
          $user = "${{ env.ALIST_USER }}"
          $pass = "${{ env.ALIST_PASS }}"
          $uploadPath = "/阿里云盘-Windows_10_11_ISO/${{ env.FIX_RELEASE_TAG }}"

          # 登录获取Token
          $loginBody = @{username=$user;password=$pass} | ConvertTo-Json
          $loginRes = Invoke-RestMethod -Method Post -Uri "$baseUrl/api/auth/login" -Body $loginBody -ContentType "application/json"
          $token = $loginRes.data.token
          $header = @{Authorization="Bearer $token"}

          # 自动创建远端文件夹
          try{
            $mkBody = @{path=$uploadPath} | ConvertTo-Json
            Invoke-RestMethod -Uri "$baseUrl/api/fs/mkdir" -Method Post -Headers $header -Body $mkBody -ContentType "application/json" | Out-Null
          }catch{ Write-Host "目录已存在，跳过创建" }

          # 逐个分卷流式上传
          $files = Get-ChildItem "${{ env.FIX_RELEASE_TAG }}_${{ env.Build_VERSION }}.zip.*"
          foreach ($f in $files) {
            Write-Host "开始上传Alist：$($f.Name)"
            $fullTarget = "$uploadPath/$($f.Name)"
            $putHeader = @{
              "Authorization" = "Bearer $token"
              "File-Path"     = $fullTarget
              "Content-Type"  = "application/octet-stream"
            }
            Invoke-RestMethod -Uri "$baseUrl/api/fs/put" -Method Put -Headers $putHeader -InFile $f.FullName
            Start-Sleep 3
          }

      # 清理临时文件
      - name: Clean Workspace
        shell: pwsh
        run: Remove-Item ./aliyunpan,./aliyunpan.zip -Recurse -Force -ErrorAction SilentlyContinue
