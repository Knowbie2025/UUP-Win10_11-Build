name: 上传Zip/修改auto-unzip-build.yml自动构建
on:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/auto-unzip-build.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 删除旧目录并解压新版压缩包
        shell: powershell
        run: |
          $root = $env:GITHUB_WORKSPACE
          $zipList = Get-ChildItem -Path $root -Filter *.zip
          foreach ($zip in $zipList) {
            $zipFull = $zip.FullName
            $folderName = $zip.BaseName
            $targetPath = Join-Path -Path $root -ChildPath $folderName

            # 删除旧文件夹
            if (Test-Path -Path $targetPath) {
              Remove-Item -Path $targetPath -Recurse -Force
            }
            # 标准完整参数创建目录，不用简写 -Dir
            New-Item -Path $targetPath -ItemType Directory -Force | Out-Null
            # 解压
            Expand-Archive -Path $zipFull -DestinationPath $targetPath -Force
            # 清理zip
            Remove-Item -Path $zipFull -Force
          }

      - name: 运行UUP构建脚本
        shell: cmd
        run: |
          @echo off
          for /d %%dir in (Windows*_*) do (
            echo 正在构建 %%dir
            cd %%dir
            if exist uup_download_windows.cmd call uup_download_windows.cmd
            cd ..
          )

      - name: 上传成品ISO
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Built-ISO
          path: "*.iso"
          retention-days: 30
