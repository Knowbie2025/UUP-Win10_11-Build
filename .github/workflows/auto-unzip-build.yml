name: Zip上传自动构建UUP镜像
on:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/auto-unzip-build.yml"

jobs:
  build_task:
    runs-on: windows-latest
    steps:
      - name: 检出仓库文件
        uses: actions/checkout@v4

      - name: 解压压缩包（先删除旧目录再解压，完整替换）
        shell: powershell
        run: |
          Get-ChildItem . -Filter *.zip | ForEach-Object {
              $zipFile = $_.FullName
              $folderName = $_.BaseName
              if (Test-Path $folderName) {
                  Remove-Item -Path $folderName -Recurse -Force
                  Write-Host "🗑️ 清除旧目录 $folderName"
              }
              New-Item -ItemType Directory -Path $folderName -Force
              Expand-Archive -Path $zipFile -DestinationPath $folderName -Force
              Write-Host "✅ 完整解压新版 $($_.Name) 至 ./$folderName"
          }

      - name: 执行UUP下载&封装ISO脚本
        shell: cmd
        run: |
          @echo off
          for /d %%dir in (Windows*_*) do (
            echo ==============================================
            echo 开始构建目录 %%dir
            echo ==============================================
            cd %%dir
            if exist uup_download_windows.cmd (
              call uup_download_windows.cmd
            ) else (
              echo ❌ %%dir 缺少uup下载脚本，跳过
            )
            cd ..
          )

      - name: 上传成品ISO
        uses: actions/upload-artifact@v4
        with:
          name: Windows-ISO-Output
          path: "*.iso"
          retention-days: 30
