name: Auto Build UUP ISO
on:
  push:
    paths:
      - '*.zip' # 仅推送zip压缩包时触发
      - ".github/workflows/auto-unzip-build.yml"

jobs:
  build:
    runs-on: windows-latest # Windows runner 原生支持批处理
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 匹配压缩包并解压
        shell: powershell
        run: |
          # 遍历根目录所有zip文件
          Get-ChildItem . -Filter *.zip | ForEach-Object {
            $zipName = $_.BaseName
            # 创建同名文件夹
            New-Item -ItemType Directory -Path $zipName -Force
            # 解压到对应目录
            Expand-Archive -Path $_.FullName -DestinationPath $zipName -Force
            Write-Host "已解压 $($_.Name) 到目录 $zipName"
          }

      - name: 执行UUP下载转换批处理
        shell: cmd
        run: |
          @echo off
          :: 遍历所有UUP目录执行脚本
          for /d %%d in (Windows*_amd64 Windows*_x86 Windows*_arm64) do (
            cd %%d
            if exist uup_download_windows.cmd (
              echo 开始构建 %%d 镜像
              call uup_download_windows.cmd
            )
            cd ..
          )

      - name: 上传生成的ISO镜像
        uses: actions/upload-artifact@v4
        with:
          name: Windows-ISO-Output
          path: '*.iso'
          retention-days: 30
