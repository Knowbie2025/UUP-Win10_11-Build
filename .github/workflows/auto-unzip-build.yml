name: Zip上传自动解压构建
on:
  push:
    paths:
      - "*.zip"

jobs:
  build_task:
    runs-on: windows-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 预处理压缩包（根目录同层级解压）
        shell: powershell
        run: |
          $workRoot = $env:GITHUB_WORKSPACE
          Get-ChildItem -Path $workRoot -Filter *.zip | ForEach-Object {
              $zipFile = $_.FullName
              $folderName = $_.BaseName
              $targetFolder = Join-Path -Path $workRoot -ChildPath $folderName

              Write-Host "处理压缩包：$($_.Name)"
              Write-Host "目标目录：$targetFolder"

              # 删除旧目录
              if (Test-Path $targetFolder) {
                  Remove-Item -Path $targetFolder -Recurse -Force
                  Write-Host "已删除旧目录 $folderName"
              }
              # 新建目录
              New-Item -Path $targetFolder -ItemType Directory -Force | Out-Null
              # 解压
              Expand-Archive -Path $zipFile -DestinationPath $targetFolder -Force
              Write-Host "解压完成 $($_.Name)"
              # 清理zip
              Remove-Item -Path $zipFile -Force
          }

      - name: 执行UUP构建脚本
        shell: powershell
        run: |
          $workRoot = $env:GITHUB_WORKSPACE
          Get-ChildItem -Path $workRoot -Directory -Filter "Windows*_*" | ForEach-Object {
              $dir = $_.FullName
              Write-Host "开始构建：$($_.Name)"
              Set-Location $dir
              if (Test-Path "uup_download_windows.cmd") {
                  cmd /c uup_download_windows.cmd
              } else {
                  Write-Host "缺少脚本，跳过"
              }
              Set-Location $workRoot
          }

      - name: 上传ISO产物
        uses: actions/upload-artifact@v4
        with:
          name: Windows-ISO
          path: "*.iso"
          retention-days: 30
