name: Auto Unzip & Build UUP ISO
# 仅当根目录上传 .zip 文件时触发流水线
on:
  push:
    paths:
      - "*.zip"

jobs:
  build_windows:
    runs-on: windows-latest
    steps:
      # 拉取仓库全部代码
      - name: Checkout repo
        uses: actions/checkout@v4

      # 自动解压所有根目录zip到同名文件夹
      - name: Unzip archive to same folder
        shell: powershell
        run: |
          Get-ChildItem -Path . -Filter *.zip | ForEach-Object {
              $zipFile = $_.FullName
              $folderName = $_.BaseName
              # 创建对应空文件夹
              New-Item -Path $folderName -ItemType Directory -Force
              # 解压文件
              Expand-Archive -Path $zipFile -DestinationPath $folderName -Force
              Write-Host "✅ 已解压 $($_.Name) 至 ./$folderName"
          }

      # 遍历所有Windows目录，自动执行UUP批处理
      - name: Run UUP download & convert script
        shell: cmd
        run: |
          @echo off
          for /d %%dir in (Windows*_*) do (
              echo ======================================
              echo 正在处理目录: %%dir
              echo ======================================
              cd %%dir
              if exist uup_download_windows.cmd (
                  call uup_download_windows.cmd
              ) else (
                  echo ⚠️ %%dir 内未找到构建脚本，跳过
              )
              cd ..
          )

      # 上传生成的ISO文件到流水线产物
      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: Built-Windows-ISO
          path: "*.iso"
          retention-days: 30

      # 可选：自动把ISO发布到Releases
      - name: Release ISO to GitHub Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          files: "*.iso"
          tag_name: AutoBuild-${{ github.sha }}
          name: Auto Build ISO ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
