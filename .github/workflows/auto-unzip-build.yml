name: Zip上传临时解压构建
on:
  push:
    paths:
      "*.zip"
      - ".github/workflows/auto-unzip-build.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      # 极简单行PowerShell，无多余输出、无引号报错
      - name: 删除旧目录+解压新版
        shell: powershell
        run: |
          $root=$env:GITHUB_WORKSPACE;Get-ChildItem $root -Filter *.zip|%{$zip=$_.FullName;$dir=$_.BaseName;$out="$root\$dir";if(Test-Path $out){Remove-Item $out -Recurse -Force};New-Item $out -Dir -Force;Expand-Archive $zip $out -Force;Remove-Item $zip -Force}

      # 批量执行UUP构建脚本
      - name: 构建Windows镜像
        shell: cmd
        run: |
          @echo off
          for /d %%d in (Windows*_*) do (
            cd %%d
            if exist uup_download_windows.cmd call uup_download_windows.cmd
            cd ..
          )

      # 上传生成的ISO
      - name: 导出ISO产物
        uses: actions/upload-artifact@v4
        with:
          name: Windows-ISO
          path: *.iso
