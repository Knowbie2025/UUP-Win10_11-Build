name: Zip上传自动构建UUP镜像
on:
  push:
    paths:
      - "*.zip"

jobs:
  build_task:
    runs-on: windows-latest
    steps:
      - name: 检出仓库文件
        uses: actions/checkout@v4

      - name: 解压压缩包（先删旧目录，推送新版回仓库）
        shell: powershell
        run: |
          Get-ChildItem . -Filter *.zip | ForEach-Object {
              $zipFile = $_.FullName
              $folderName = $_.BaseName
              if (Test-Path $folderName) {
                  Remove-Item -Path $folderName -Recurse -Force
                  Write-Host "🗑️ 清除旧目录 $folderName"
              }
              New-Item -ItemType Directory -Path $folderName -Force
              Expand-Archive -Path $zipFile -DestinationPath $folderName -Force
              Write-Host "✅ 完整解压新版 $($_.Name) 至 ./$folderName"
              Remove-Item -Path $zipFile -Force
          }
          # 推送更新后的目录到远程仓库
          git config --global user.name "Knowbie2025"
          git config --global user.email "auto-build@github@example.com"
          git add .
          git commit -m "Auto replace folder by uploaded zip"
          git push origin main
      - name: 执行UUP下载&封装ISO脚本
        shell: powershell
        run: |
          Get-ChildItem -Directory -Filter "Windows*_*" | ForEach-Object {
              $dir = $_.FullName
              Write-Host "======================================"
              Write-Host "开始构建目录: $($_.Name)"
              Write-Host "======================================"
              Set-Location $dir
              if (Test-Path "uup_download_windows.cmd") {
                  cmd /c "uup_download_windows.cmd"
              } else {
                  Write-Host "❌ $($_.Name) 缺少构建脚本，跳过"
              }
              Set-Location $env:GITHUB_WORKSPACE
          }
      - name: 上传成品ISO
        uses: actions/upload-artifact@v4
        with:
          name: Windows-ISO-Output
          path: "*.iso"
          retention-days: 30
