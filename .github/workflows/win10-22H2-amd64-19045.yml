name: Windows10_22H2_amd64

# 包含8-9个版本 （家庭中文版、专业版、企业版、教育版、专业工作站版、专业教育版、企业多会话版、loT企业版、loT企业订阅版）

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/win10-22H2-amd64-19045.yml'

permissions:
  contents: write

env:
  Build_VERSION: '19045.7417'
  FILE_NAME: Windows10_22H2_amd64
  FIX_RELEASE_TAG: Windows10_22H2_amd64
  ALI_YUN_DRIVE_UPLOAD_PATH: Windows_10_11_ISO/Windows10_22H2_amd64
  ALIST_URL: ${{ secrets.ALIST_DOMAIN }}
  ALIST_USER: ${{ secrets.ALIST_USER }}
  ALIST_PASS: ${{ secrets.ALIST_PWD }}

jobs:
  Build_UUP:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # 全局清理所有失效链接，同时处理autodl配置文件兜底
      - name: Overwrite All Dead Links In Script & AutoDL Config
        shell: pwsh
        run: |
          $cmdPath = Join-Path $env:FILE_NAME "uup_download_windows.cmd"
          $raw = Get-Content $cmdPath -Raw -Encoding ASCII
          $newConvUrl = "https://ghfast.top/https://git.uupdump.net/uup-dump/misc/raw/branch/master/uup-converter-wimlib.7z"
          $newAriaUrl = "https://ghfast.top/https://git.uupdump.net/uup-dump/misc/raw/branch/master/aria2c.exe"
          $new7zUrl = "https://ghfast.top/https://git.uupdump.net/uup-dump/misc/raw/branch/master/7zr.exe"

          # 替换URL变量定义
          $raw = $raw -replace '(?m)^set CONVERTER_URL=.*$', "set CONVERTER_URL=$newConvUrl"
          $raw = $raw -replace '(?m)^set ARIA2_URL=.*$', "set ARIA2_URL=$newAriaUrl"
          $raw = $raw -replace '(?m)^set SEVENZIP_URL=.*$', "set SEVENZIP_URL=$new7zUrl"

          # 暴力清除所有带版本号的转换器旧链接
          $raw = $raw -replace "https://uupdump\.net/misc/uup-converter-wimlib-\d+\.7z", $newConvUrl
          # 替换工具exe原始域名链接
          $raw = $raw -replace "https://uupdump\.net/misc/aria2c\.exe", $newAriaUrl
          $raw = $raw -replace "https://uupdump\.net/misc/7zr\.exe", $new7zUrl
          # 兜底替换所有uupdump.net/misc根域名
          $raw = $raw -replace "https://uupdump\.net/misc/", "https://ghfast.top/https://git.uupdump.net/uup-dump/misc/raw/branch/master/"

          # aria2 关闭SSL校验适配海外Runner
          $raw = $raw -replace "aria2c ", "aria2c --check-certificate=false "

          Set-Content $cmdPath $raw -Encoding ASCII

          # 同步修复autodl_files内的配置（如果存在）
          $autodlPath = Join-Path $env:FILE_NAME "autodl_files\converter_windows"
          if(Test-Path $autodlPath){
            $adlRaw = Get-Content $autodlPath -Raw
            $adlRaw = $adlRaw -replace "https://uupdump\.net/misc/uup-converter-wimlib-\d+\.7z", $newConvUrl
            $adlRaw = $adlRaw -replace "https://uupdump\.net/misc/", "https://ghfast.top/https://git.uupdump.net/uup-dump/misc/raw/branch/master/"
            Set-Content $autodlPath $adlRaw -Encoding ASCII
          }
          Write-Host "✅ 全部v版本废弃链接清理完成，同步修复autodl配置"

      # UUP 编译打包 ISO
      - name: UUP dump build ISO
        shell: cmd
        run: |
          cd %FILE_NAME%
          dir
          uup_download_windows.cmd

      - name: List ISO Files
        shell: cmd
        run: |
          cd %FILE_NAME%
          dir *.iso
          cd ..

      # 安装 7zip
      - name: Install 7-Zip via Powershell
        shell: pwsh
        run: |
          choco install 7zip -y
          echo "${env:ProgramFiles}\\7-Zip" | Out-File -FilePath $env:GITHUB_PATH -Append

      # 2000M 分卷压缩
      - name: Split Compress ZIP(1.95G/part)
        shell: cmd
        run: 7z a -tzip -v2000M %FIX_RELEASE_TAG%_%Build_VERSION%.zip %FILE_NAME%\*.iso -mx=6

      # 生成 Release 正文
      - name: Gen Release Body (Auto Open)
        id: gen_body
        shell: pwsh
        run: |
          $files = Get-ChildItem "${{ env.FIX_RELEASE_TAG }}_${{ env.Build_VERSION }}.zip.*" | Select-Object -ExpandProperty Name
          $md = "<details open>`n<summary>📦 各分卷压缩包名（家庭中文版、专业版、企业版、教育版等等-下载各分卷至同一文件夹后解压任一即可）</summary>`n`n"
          foreach($f in $files){ $md += "- $f`n" }
          $md += "`n</details>"
          echo "BODY_CONTENT<<EOF" >> $env:GITHUB_ENV
          echo $md >> $env:GITHUB_ENV
          echo "EOF" >> $env:GITHUB_ENV

      # 上传制品缓存
      - name: Upload Split Zip Artifact
        uses: actions/upload-artifact@v6
        with:
          name: ISO-Split-Zip-Pack
          path: |
            ${{ env.FIX_RELEASE_TAG }}_${{ env.Build_VERSION }}.zip.*

      # 创建 Github Release
      - name: Create Github Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.FIX_RELEASE_TAG }}_${{ env.Build_VERSION }}
          name: Release ${{ env.FIX_RELEASE_TAG }}_${{ env.Build_VERSION }}
          body: ${{ env.BODY_CONTENT }}
          files: |
            ${{ env.FIX_RELEASE_TAG }}_${{ env.Build_VERSION }}.zip.*
          generate_release_notes: false
          append_body: false

      # 安装 aliyunpan-cli v0.3.7
      - name: Install aliyunpan-cli(v0.3.7)
        shell: pwsh
        run: |
          $url = "https://ghfast.top/https://github.com/tickstep/aliyunpan/releases/download/v0.3.7/aliyunpan-v0.3.7-windows-x64.zip"
          Invoke-WebRequest -Uri $url -OutFile aliyunpan.zip -UseBasicParsing -TimeoutSec 180 -SkipCertificateCheck
          7z x aliyunpan.zip -oaliyunpan -spe -y
          $ALI_EXE = (Get-ChildItem ./aliyunpan -Recurse -Filter "aliyunpan.exe").FullName
          echo "ALI_EXE=$ALI_EXE" >> $env:GITHUB_ENV

      # 阿里云盘 - Refresh Token 登录
      - name: Login to Aliyun Drive
        shell: pwsh
        run: |
          & "$env:ALI_EXE" token set -t "${{ secrets.ALI_REFRESH_TOKEN }}"
          & "$env:ALI_EXE" whoami

      # 阿里云盘自动建目录
      - name: Mkdir Aliyun Remote Dir
        shell: pwsh
        run: |
          $remotePath="${{ env.ALI_YUN_DRIVE_UPLOAD_PATH }}"
          Write-Host "阿里云目标路径：$remotePath"
          $checkRet = & "$env:ALI_EXE" ls "$remotePath" 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Host "目录不存在，正在创建..."
            & "$env:ALI_EXE" mkdir -p "$remotePath"
            Start-Sleep 2
          }

      # 阿里云盘分卷上传（带重试）
      - name: Upload to Aliyun Drive
        shell: pwsh
        run: |
          $remotePath="${{ env.ALI_YUN_DRIVE_UPLOAD_PATH }}"
          $fileList = Get-ChildItem "${{ env.FIX_RELEASE_TAG }}_${{ env.Build_VERSION }}.zip.*"
          & "$env:ALI_EXE" cd "$remotePath"
          foreach($f in $fileList){
            Write-Host "开始上传阿里云：$($f.Name)"
            $retry = 2
            for($i=0;$i -le $retry;$i++){
              & "$env:ALI_EXE" upload "$($f.FullName)"
              if($LASTEXITCODE -eq 0){ break }
              Write-Host "上传失败，等待10s重试，剩余重试次数：$($retry - $i)"
              Start-Sleep 10
            }
            Start-Sleep 3
          }

      # Alist 上传
      - name: Upload to Alist
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $baseUrl = "${{ env.ALIST_URL }}"
          $user = "${{ secrets.ALIST_USER }}"
          $pass = "${{ secrets.ALIST_PASS }}"
          $uploadPath = "/阿里云盘-Windows_10_11_ISO/${{ env.FIX_RELEASE_TAG }}"

          # 登录获取Token
          $loginBody = @{username=$user;password=$pass} | ConvertTo-Json
          $loginRes = Invoke-RestMethod -Method Post -Uri "$baseUrl/api/auth/login" -Body $loginBody -ContentType "application/json"
          $token = $loginRes.data.token
          $header = @{Authorization="Bearer $token"}

          # 自动创建远端文件夹
          try{
            $mkBody = @{path=$uploadPath} | ConvertTo-Json
            Invoke-RestMethod -Uri "$baseUrl/api/fs/mkdir" -Method Post -Headers $header -Body $mkBody -ContentType "application/json" | Out-Null
          }catch{ Write-Host "目录已存在，跳过创建" }

          # 逐个分卷流式上传
          $files = Get-ChildItem "${{ env.FIX_RELEASE_TAG }}_${{ env.Build_VERSION }}.zip.*"
          foreach ($f in $files) {
            Write-Host "开始上传Alist：$($f.Name)"
            $fullTarget = "$uploadPath/$($f.Name)"
            $putHeader = @{
              "Authorization" = "Bearer $token"
              "File-Path"     = $fullTarget
              "Content-Type"  = "application/octet-stream"
            }
            Invoke-RestMethod -Uri "$baseUrl/api/fs/put" -Method Put -Headers $putHeader -InFile $f.FullName
            Start-Sleep 3
          }

      # 清理临时文件
      - name: Clean Workspace
        shell: pwsh
        run: Remove-Item ./aliyunpan,./aliyunpan.zip -Recurse -Force -ErrorAction SilentlyContinue
