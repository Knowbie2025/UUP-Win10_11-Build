name: Clean All Old Windows Releases

on:
  release:
    types: [published]
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

# 全局授予读写权限，解决删除Release权限报错
permissions:
  contents: write
  releases: write

jobs:
  clean-win10-22h2-amd64:
    runs-on: ubuntu-latest
    steps:
      - name: Clean Windows10_22H2_amd64 releases (keep latest 3)
        uses: dev-drprasad/delete-older-releases@v0.3.2
        with:
          keep_latest: 3
          delete_tag_pattern: 'Windows10_22H2_amd64*'
          delete_tags: true

  clean-win10-22h2-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Clean Windows10_22H2_arm64 releases (keep latest 3)
