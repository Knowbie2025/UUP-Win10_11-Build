name: Clean All Old Windows Releases

on:
  release:
    types: [published]  # 每次发布新版本后自动清理
  schedule:
    - cron: '0 0 * * 0'  # 每周日 0 点自动清理（可选）
  workflow_dispatch:     # 允许手动触发，方便调试

jobs:
  # ===== Windows 10 系列 =====
  clean-win10-22h2-amd64:
    runs-on: ubuntu-latest
    steps:
      - name: Clean Windows10_22H2_amd64 releases (keep latest 3)
        uses: dev-drprasad/delete-older-releases@v0.3.2
        with:
          repo: ${{ github.repository }}
          keep_latest: 3
          regex_pattern: 'Windows10_22H2_amd64.*'
          delete_tags: true
          delete_older_than: 0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  clean-win10-22h2-arm64:
