name: Windows11_23H2_amd64

# 提交代码自动执行+手动运行
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

env:
  Build_VERSION: '22631.7079'
  FILE_NAME: 'Windows11_23H2_amd64'

jobs:
  Windows11_23H2_amd64:
    runs-on: windows-latest

    steps:
    # 拉取代码
    - name: Checkout repository
      uses: actions/checkout@v5

    # 不存在就自动创建文件夹
    - name: Create Work Folder
    shell: cmd
    run: if not exist %FILE_NAME% md %FILE_NAME%

    # 运行UUP脚本
    - name: UUP dump WinISO
      shell: cmd
      run: |
        cd %FILE_NAME%
        dir
        uup_download_windows.cmd

    - name: Check dir
      shell: cmd
      run: |
        cd %FILE_NAME%
        dir

    # 安装7zip
    - name: Install 7Zip
      run: choco install 7zip -y

    # 压缩打包
    - name: Package binaries
      run: |
        "C:\Program Files\7-Zip\7z.exe" a -v1950M %FILE_NAME%-%Build_VERSION%.7z ./%FILE_NAME%/*.iso -mx=9

    # 上传产物
    - uses: actions/upload-artifact@v4
      with:
        name: ${{env.FILE_NAME}}-${{env.Build_VERSION}}
        path: ${{env.FILE_NAME}}-${{env.Build_VERSION}}.7z*

    # 自动发布Release
    - name: Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{env.FILE_NAME}}-${{env.Build_VERSION}}
        release_name: ${{env.FILE_NAME}}-${{env.Build_VERSION}}
        files: ${{env.FILE_NAME}}-${{env.Build_VERSION}}.7z*
