name: Clean_All_Workflow
on:
  workflow_dispatch:
  schedule:
    - cron: '0 19 * * *'  # UTC 19:00 = 北京时间 03:00

jobs:
  clean:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: All workflows keep 2 runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 2
