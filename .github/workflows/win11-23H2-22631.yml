name: Windows11_23H2_amd64
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
env:
  FIX_RELEASE_TAG: ${{ github.ref_name }}
  FILE_NAME: Windows11_23H2_amd64
permissions:
  contents: write
jobs:
  build_pack:
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Powershell语法读取环境变量 $env:xxx
      - name: List ISO Files
        run: |
          cd $env:FILE_NAME
          dir *.iso
          cd ..

      - name: Install 7-Zip via Powershell
        shell: pwsh
        run: |
          choco install 7zip -y
          echo "${env:ProgramFiles}\7-Zip" | Out-File -FilePath $env:GITHUB_PATH -Append

      # 压缩命令同步换成powershell变量写法
      - name: Split Compress ZIP(1.9G/part)
        run: |
          7z a -tzip -v1900M $env:FIX_RELEASE_TAG.zip ./$env:FILE_NAME/*.iso -mx=6

      - name: Upload Split Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ISO-Split-Zip-Pack
          path: |
            *.zip
            *.z01
            *.z02
            *.z*

      - name: Create Github Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.FIX_RELEASE_TAG }}
          name: Release ${{ env.FIX_RELEASE_TAG }}
          files: |
            *.zip
            *.z01
            *.z02
            *.z*
