name: Windows11_23H2_amd64
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
env:
  FIX_RELEASE_TAG: ${{ github.ref_name }}
  FILE_NAME: Windows11_23H2_amd64
permissions:
  contents: write
jobs:
  build_pack:
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # CMD查看ISO目录
      - name: List ISO Files
        shell: cmd
        run: |
          cd %FILE_NAME%
          dir *.iso
          cd ..

      # PS安装7zip不变
      - name: Install 7-Zip via Powershell
        shell: pwsh
        run: |
          choco install 7zip -y
          echo "${env:ProgramFiles}\7-Zip" | Out-File -FilePath $env:GITHUB_PATH -Append

      # 关键：切CMD打包，%变量原生支持，路径不会乱转
      - name: Split Compress ZIP(1.9G/part)
        shell: cmd
        run: 7z a -tzip -v1900M %FIX_RELEASE_TAG%.zip %FILE_NAME%\*.iso -mx=6

      - name: Upload Split Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ISO-Split-Zip-Pack
          path: |
            *.zip
            *.z01
            *.z02
            *.z*

      - name: Create Github Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.FIX_RELEASE_TAG }}
          name: Release ${{ env.FIX_RELEASE_TAG }}
          files: |
            *.zip
            *.z01
            *.z02
            *.z*
