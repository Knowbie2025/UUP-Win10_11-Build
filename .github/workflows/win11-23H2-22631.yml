name: Windows11_23H2_amd64

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/win11-23H2-22631.yml'

permissions:
  contents: write

env:
  Build_VERSION: '22631.7079'
  FILE_NAME: Windows11_23H2_amd64
  FIX_RELEASE_TAG: Windows11_23H2_amd64
  ALI_YUN_DRIVE_UPLOAD_PATH: /Windows_10_11_ISO/Windows11_23H2_amd64

jobs:
  Build_UUP:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # 自动获取aliyunpan最新正式版
      - name: Get latest aliyunpan version
        id: get_ali_ver
        shell: pwsh
        run: |
          $res = Invoke-RestMethod -Uri "https://api.github.com/repos/tickstep/aliyunpan/releases/latest"
          $tag = $res.tag_name
          echo "latest_ver=$tag" >> $env:GITHUB_ENV

      # UUP编译ISO镜像
      - name: UUP dump build ISO
        shell: cmd
        run: |
          cd %FILE_NAME%
          dir
          uup_download_windows.cmd

      - name: List ISO Files
        shell: cmd
        run: |
          cd %FILE_NAME%
          dir *.iso
          cd ..

      # 安装7zip
      - name: Install 7-Zip via Powershell
        shell: pwsh
        run: |
          choco install 7zip -y
          echo "${env:ProgramFiles}\7-Zip" | Out-File -FilePath $env:GITHUB_PATH -Append

      # 1.9G分卷压缩
      - name: Split Compress ZIP(1.9G/part)
        shell: cmd
        run: 7z a -tzip -v1900M %FIX_RELEASE_TAG%_%Build_VERSION%.zip %FILE_NAME%\*.iso -mx=6

      # =====新增：生成默认展开的附件清单内容，存入环境变量=====
      - name: Gen Release Body List
        id: gen_body
        shell: pwsh
        run: |
          $files = Get-ChildItem "${{ env.FIX_RELEASE_TAG }}_${{ env.Build_VERSION }}.zip.*" | Select-Object -ExpandProperty Name
          $md = "<details open>`n<summary>📦 分卷压缩包（默认展开）</summary>`n`n"
          foreach($f in $files){
            $md += "- $f`n"
          }
          $md += "`n</details>`n`n> 下方Assets为Github原生自带附件（无法默认展开）"
          echo "BODY_CONTENT<<EOF" >> $env:GITHUB_ENV
          echo $md >> $env:GITHUB_ENV
          echo "EOF" >> $env:GITHUB_ENV

      # 构建物临时保存
      - name: Upload Split Zip Artifact
        uses: actions/upload-artifact@v6
        with:
          name: ISO-Split-Zip-Pack
          path: |
            ${{ env.FIX_RELEASE_TAG }}_${{ env.Build_VERSION }}.zip.*

      # Github Release发布【body改用生成好的默认展开内容】
      - name: Create Github Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.FIX_RELEASE_TAG }}_${{ env.Build_VERSION }}
          name: Release ${{ env.FIX_RELEASE_TAG }}_${{ env.Build_VERSION }}
          body: ${{ env.BODY_CONTENT }}
          files: |
            ${{ env.FIX_RELEASE_TAG }}_${{ env.Build_VERSION }}.zip.*
          generate_release_notes: false

      # 下载安装aliyunpan
      - name: Install aliyunpan-cli(动态最新版)
        shell: pwsh
        run: |
          $ver = $env:latest_ver
          $rawUrl = "https://github.com/tickstep/aliyunpan/releases/download/$ver/aliyunpan-$ver-windows-x64.zip"
          $downUrl = "https://ghfast.top/$rawUrl"
          Write-Host "Download aliyunpan -> $downUrl"
          Invoke-WebRequest -Uri $downUrl -OutFile aliyunpan.zip -UseBasicParsing -TimeoutSec 120
          7z x aliyunpan.zip -oaliyunpan >$null
          $aliExePath = Get-ChildItem -Path ./aliyunpan -Recurse -Filter aliyunpan.exe | Select-Object -First 1
          $aliBinDir = Split-Path $aliExePath.FullName -Parent
          echo "$aliBinDir" | Out-File -FilePath $env:GITHUB_PATH -Append
          Write-Host "aliyunpan bin path: $aliBinDir"

      # 查看客户端版本
      - name: Check aliyunpan version
        shell: pwsh
        run: aliyunpan -v

      # 写入配置免密登录【改用单行写入，规避here-string缩进报错】
      - name: Login to Aliyun Drive
        shell: pwsh
        run: |
          $confPath = "$HOME\.aliyunpan"
          New-Item -ItemType Directory -Path $confPath -Force | Out-Null
          "refresh_token=${{ secrets.ALI_REFRESH_TOKEN }}" | Out-File "$confPath\user.token" -Encoding utf8
          aliyunpan whoami

      # 创建远端目录（不存在自动创建）
      - name: Create target remote folder
        shell: pwsh
        run: |
          aliyunpan mkdir -p "${{ env.ALI_YUN_DRIVE_UPLOAD_PATH }}"

      # 循环逐个上传分卷包
      - name: Upload files to Aliyun Drive
        shell: pwsh
        run: |
          $fileList = Get-ChildItem "${{ env.FIX_RELEASE_TAG }}_${{ env.Build_VERSION }}.zip.*"
          foreach ($file in $fileList) {
              Write-Host "正在上传：$($file.Name)"
              try {
                  aliyunpan u $file.FullName "${{ env.ALI_YUN_DRIVE_UPLOAD_PATH }}"
                  Start-Sleep -Seconds 3
                  Write-Host "$($file.Name) 上传完成"
              } catch {
                  Write-Warning "$($file.Name) 上传异常，跳过"
              }
          }
